name: Build plugin release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP and JavaScript syntax
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          node --check bb-reviews/assets/bb-reviews.js
      - name: Build and check tag
        run: |
          VERSION=$(python3 tools/package.py)
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - name: Publish release with installable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --verify-tag --title "BB Reviews $GITHUB_REF_NAME" --generate-notes
